<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title description">
  <title id="title">列表页与工作视图结构</title>
  <desc id="description">顶部左侧为新增、编辑、查看、输出、其他，右侧为关键词、查询、重置和带数量角标的筛选。第二行为工作视图选择、默认与修改标记、布局保存状态和管理入口。下方为固定表头、内部滚动的表体及统计分页。</desc>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2937; font-size: 15px; }
      .muted { fill: #64748b; font-size: 14px; }
      .small { font-size: 13px; }
      .header { font-weight: 600; }
      .line { stroke: #d8dee7; stroke-width: 1; fill: none; }
      .button { fill: #fff; stroke: #cbd5e1; stroke-width: 1; }
      .icon { stroke: #64748b; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="chevron" class="icon"><path d="m-4-2 4 4 4-4"/></g>
    <g id="filter" class="icon"><path d="M-7-6H7L2 0v6L-2 4V0Z"/></g>
    <g id="sort" class="icon"><path d="M-3 6V-6m-3 3 3-3 3 3M3-6V6m-3-3 3 3 3-3"/></g>
    <g id="checkbox"><rect x="-7" y="-7" width="14" height="14" rx="3" fill="#fff" stroke="#94a3b8"/></g>
  </defs>
  <rect width="1280" height="430" fill="#fff"/>
  <rect x="16" y="16" width="1248" height="398" rx="8" fill="#fff" stroke="#cbd5e1"/>

  <g aria-label="页面工具栏">
    <rect class="button" x="32" y="32" width="84" height="32" rx="5"/>
    <rect class="button" x="124" y="32" width="84" height="32" rx="5"/>
    <rect class="button" x="216" y="32" width="84" height="32" rx="5"/>
    <rect class="button" x="308" y="32" width="84" height="32" rx="5"/>
    <rect class="button" x="400" y="32" width="84" height="32" rx="5"/>
    <text x="48" y="53">新增</text><use href="#chevron" transform="translate(98 48)"/>
    <text x="140" y="53">编辑</text><use href="#chevron" transform="translate(190 48)"/>
    <text x="232" y="53">查看</text><use href="#chevron" transform="translate(282 48)"/>
    <text x="324" y="53">输出</text><use href="#chevron" transform="translate(374 48)"/>
    <text x="416" y="53">其他</text><use href="#chevron" transform="translate(466 48)"/>
    <rect class="button" x="768" y="32" width="280" height="32" rx="5"/>
    <text class="muted" x="780" y="53">关键词，每行一个</text>
    <rect x="1060" y="32" width="92" height="32" rx="5" fill="#2563eb"/>
    <circle cx="1079" cy="46" r="5" fill="none" stroke="#fff" stroke-width="1.7"/>
    <path d="m1083 50 4 4" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="1098" y="53" style="fill:#fff">查询</text>
    <rect class="button" x="1164" y="32" width="36" height="32" rx="5"/>
    <g class="icon" transform="translate(1182 48)"><path d="M-6-3a7 7 0 1 1-1 6M-6-8v5h5"/></g>
    <rect x="1212" y="32" width="36" height="32" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
    <use href="#filter" transform="translate(1230 48)"/>
    <circle cx="1245" cy="30" r="10" fill="#2563eb" stroke="#fff" stroke-width="2"/>
    <text x="1245" y="34" text-anchor="middle" style="fill:#fff;font-size:11px;font-weight:600">3</text>
  </g>
  <path class="line" d="M16 80H1264"/>

  <g aria-label="工作视图行">
    <text class="muted" x="32" y="117">工作视图</text>
    <rect class="button" x="104" y="96" width="240" height="32" rx="5"/>
    <text x="116" y="117">公司 · 常用视图</text><use href="#chevron" transform="translate(326 112)"/>
    <path d="m366 102 2.6 5.5 6.1.8-4.4 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6-4.4-4.2 6.1-.8Z" fill="#2563eb"/>
    <text x="390" y="117" style="fill:#a16207;font-size:14px">已修改</text>
    <text class="muted" x="928" y="117">列布局已保存</text>
    <rect x="1040" y="96" width="108" height="32" rx="5" fill="#eff6ff"/>
    <text x="1094" y="117" text-anchor="middle" style="fill:#1d4ed8;font-size:14px">保存视图</text>
    <rect class="button" x="1212" y="96" width="36" height="32" rx="5"/>
    <g fill="#64748b"><circle cx="1223" cy="112" r="1.7"/><circle cx="1230" cy="112" r="1.7"/><circle cx="1237" cy="112" r="1.7"/></g>
  </g>

  <g aria-label="表格">
    <rect x="17" y="144" width="1246" height="44" fill="#f1f5f9"/>
    <path class="line" d="M16 144H1264M16 188H1264M16 232H1264M16 276H1264M16 344H1264M64 144V344M280 144V344M540 144V344M700 144V344M1000 144V344"/>
    <use href="#checkbox" transform="translate(40 166)"/>
    <text class="header" x="80" y="171">编号</text><use href="#sort" transform="translate(230 166)"/><use href="#filter" transform="translate(258 166)"/>
    <text class="header" x="296" y="171">名称</text><use href="#filter" transform="translate(518 166)"/>
    <text class="header" x="556" y="171">状态</text><use href="#filter" transform="translate(678 166)"/>
    <text class="header" x="716" y="171">创建时间</text><use href="#sort" transform="translate(950 166)"/><use href="#filter" transform="translate(978 166)"/>
    <text class="header" x="1016" y="171">其他字段</text>
    <use href="#checkbox" transform="translate(40 210)"/>
    <text x="80" y="215">REF-001</text><text x="296" y="215">示例记录 A</text>
    <rect x="556" y="198" width="56" height="24" rx="4" fill="#ecfdf5"/><text class="small" x="584" y="215" text-anchor="middle" style="fill:#047857">启用</text>
    <text class="small" x="716" y="215">2026-11-10 09:30:00</text><text class="muted" x="1016" y="215">...</text>
    <use href="#checkbox" transform="translate(40 254)"/>
    <text x="80" y="259">REF-002</text><text x="296" y="259">示例记录 B</text>
    <rect x="556" y="242" width="56" height="24" rx="4" fill="#f1f5f9"/><text class="small" x="584" y="259" text-anchor="middle" style="fill:#475569">停用</text>
    <text class="small" x="716" y="259">2026-11-10 09:45:00</text><text class="muted" x="1016" y="259">...</text>
    <rect x="435" y="294" width="410" height="32" rx="6" fill="#fff" stroke="#e2e8f0"/>
    <text class="muted" x="640" y="315" text-anchor="middle">表格内部滚动，表头与工作视图行固定</text>
    <rect x="1254" y="194" width="5" height="86" rx="2.5" fill="#cbd5e1"/>
  </g>

  <g aria-label="统计与分页">
    <text class="muted" x="32" y="385">共 N 条，已选 M 条</text>
    <text class="muted" x="756" y="385">每页条数</text>
    <rect class="button" x="824" y="364" width="74" height="32" rx="5"/><text class="small" x="840" y="385">20</text><use href="#chevron" transform="translate(880 380)"/>
    <text class="muted" x="916" y="385">上一页</text>
    <rect x="980" y="364" width="32" height="32" rx="5" fill="#2563eb"/><text x="996" y="385" text-anchor="middle" style="fill:#fff">1</text>
    <text x="1032" y="385" text-anchor="middle">2</text><text x="1068" y="385" text-anchor="middle">3</text><text class="muted" x="1104" y="385" text-anchor="middle">...</text>
    <text class="muted" x="1150" y="385">下一页</text>
  </g>
</svg>
