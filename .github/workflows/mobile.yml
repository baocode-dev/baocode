# Builds the phone app: Android (APK), put on dl.baocode.dev, where
# baocode.dev/download links to it (/dl/android); iOS, uploaded to
# TestFlight. docs/release.md, 10.
#
#   git tag mobile-v0.1.0 && git push origin mobile-v0.1.0
#                           build and publish 0.1.0 (the version of the
#                           phone app's pubspec.yaml, on its main branch)
#   git tag mobile-test-foo && git push origin mobile-test-foo
#                           build, and put the APK at dl.baocode.dev/test/…,
#                           to send to testers (iOS to TestFlight all the same)
#
# The phone app is checked out from baocode-dev/mobile beside this one
# (its pubspec.yaml takes bao_link and bao_editor from ../monad).
name: Mobile

on:
  push:
    tags: ['mobile-*']

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/mobile-v') && 'mobile-release' || format('mobile-build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    # The deploy key that reads baocode-dev/mobile is the release
    # environment's, for mobile-* tags.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
      marketing: ${{ steps.version.outputs.marketing }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: baocode-dev/mobile
          ssh-key: ${{ secrets.MOBILE_DEPLOY_KEY }}
          path: mobile
      - id: version
        name: Read the phone app's version, and match the tag against it
        working-directory: mobile
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          marketing=${version%%+*}
          echo "pubspec.yaml: $version"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::$version is not x.y.z+build"
            exit 1
          fi
          publish=false
          if [[ "$GITHUB_REF_NAME" == mobile-v* ]]; then
            if [ "$GITHUB_REF_NAME" != "mobile-v$marketing" ]; then
              echo "::error::Tag $GITHUB_REF_NAME, but the phone app is $version: the tag has to be mobile-v$marketing"
              exit 1
            fi
            publish=true
          fi
          {
            echo "version=$version"
            echo "marketing=$marketing"
            # Both builds take this commit, not whatever main is by then.
            echo "commit=$(git rev-parse HEAD)"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Build for Android
    needs: check
    runs-on: ubuntu-latest
    environment: release
    env:
      MARKETING: ${{ needs.check.outputs.marketing }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: monad
      - uses: actions/checkout@v5
        with:
          repository: baocode-dev/mobile
          ref: ${{ needs.check.outputs.commit }}
          ssh-key: ${{ secrets.MOBILE_DEPLOY_KEY }}
          path: mobile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # bao_iroh's Rust (the link), built by its build hook for the
      # phone's targets.
      - uses: ./monad/.github/actions/setup-rust
        with:
          dir: monad/packages/bao_iroh/rust
      - name: Put the release key in a file
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "BAOCODE_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: mobile
        env:
          # One key for every APK published, so that each installs over the
          # last (android/app/build.gradle.kts).
          BAOCODE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk "../out/BaoCode-$MARKETING-android.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: android
          if-no-files-found: error
          path: out/BaoCode-*-android.apk
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # iOS goes to TestFlight, not dl.baocode.dev: signed for the App Store
  # (Apple Distribution certificate, App Store profile) and uploaded, every
  # tag, mobile-test-* too. Its build number is this workflow's run number,
  # each upload's own (TestFlight refuses one it has had).
  ios:
    name: Build for iOS, to TestFlight
    needs: check
    # App Store Connect takes only apps built with the iOS 26 SDK or later
    # (Xcode 26): macos-15's Xcode 16 builds are refused at upload.
    runs-on: macos-26
    environment: release
    env:
      MARKETING: ${{ needs.check.outputs.marketing }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
      # The App Store Connect API key macOS is notarised with uploads too.
      ASC_KEY: ${{ secrets.NOTARY_KEY }}
      ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      ASC_ISSUER: ${{ secrets.NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: monad
      - uses: actions/checkout@v5
        with:
          repository: baocode-dev/mobile
          ref: ${{ needs.check.outputs.commit }}
          ssh-key: ${{ secrets.MOBILE_DEPLOY_KEY }}
          path: mobile
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # bao_iroh's Rust (the link), built by its build hook for the
      # phone's targets.
      - uses: ./monad/.github/actions/setup-rust
        with:
          dir: monad/packages/bao_iroh/rust
      - name: Put the certificate in a keychain, and the profile where Xcode finds it
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "$IOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          profile="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROFILE" | base64 --decode > "$profile"
          uuid=$(security cms -D -i "$profile" | plutil -extract UUID raw -)
          name=$(security cms -D -i "$profile" | plutil -extract Name raw -)
          # Older Xcodes look in the first, Xcode 16 and later in the second.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
          echo "IOS_PROFILE_NAME=$name" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Sign the app manually, for the App Store
        working-directory: mobile
        run: |
          # The project signs automatically (Xcode, a developer's own
          # account), which needs an account here. Its Runner target alone
          # takes the profile: the pods' targets cannot.
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
            runner = project.targets.find { |t| t.name == "Runner" }
            runner.build_configurations.find { |c| c.name == "Release" }.build_settings.merge!(
              "CODE_SIGN_STYLE" => "Manual",
              "DEVELOPMENT_TEAM" => "77SLP2NCVR",
              "CODE_SIGN_IDENTITY" => "Apple Distribution",
              "CODE_SIGN_IDENTITY[sdk=iphoneos*]" => "Apple Distribution",
              "PROVISIONING_PROFILE_SPECIFIER" => ENV.fetch("IOS_PROFILE_NAME"),
            )
            project.save
          '
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>77SLP2NCVR</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>dev.baocode.mobile</key><string>$IOS_PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
      - name: Build the IPA
        working-directory: mobile
        run: |
          xcodebuild -version
          flutter build ipa --release --build-number "$GITHUB_RUN_NUMBER" \
            --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p ../out
          cp build/ios/ipa/*.ipa "../out/BaoCode-$MARKETING-ios.ipa"
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type ios --file "out/BaoCode-$MARKETING-ios.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER"
          {
            echo "## iOS: $MARKETING ($GITHUB_RUN_NUMBER) uploaded to TestFlight"
            echo
            echo "Apple processes it for a few minutes before testers see it (App Store Connect → BaoCode → TestFlight)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Forget the certificate and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys"

  share:
    name: Put it at dl.baocode.dev/test/ for testers
    needs: [check, android, ios]
    if: needs.check.outputs.publish != 'true'
    runs-on: ubuntu-latest
    environment: release
    env:
      MARKETING: ${{ needs.check.outputs.marketing }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Upload
        run: |
          # The APK alone: iOS is in TestFlight.
          content_type() {
            case ${1##*.} in
              apk) echo application/vnd.android.package-archive ;;
              *)   echo application/octet-stream ;;
            esac
          }
          name=$(printf '%s' "${GITHUB_REF_NAME#mobile-test-}" | tr -c 'A-Za-z0-9.-' '-' | sed 's/-*$//')
          dir="test/mobile-$MARKETING-$name-$GITHUB_RUN_NUMBER"
          {
            echo "## For testers: the phone app $MARKETING, \`$GITHUB_REF_NAME\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for file in dist/BaoCode-*; do
            name=$(basename "$file")
            aws s3 cp "$file" "s3://$R2_BUCKET/$dir/$name" --cache-control 'public, max-age=86400' \
              --content-type "$(content_type "$name")"
            url="https://dl.baocode.dev/$dir/$name"
            served=$(curl -fsSI "$url" | tr -d '\r' | awk 'tolower($1) == "content-length:" { print $2 }')
            [ "$served" = "$(stat -c %s "$file")" ] || { echo "::error::$url is not served as uploaded"; exit 1; }
            echo "- [$name]($url)" >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to dl.baocode.dev
    needs: [check, android, ios]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      MARKETING: ${{ needs.check.outputs.marketing }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Upload the builds
        run: |
          # As in the share job: the type R2 has to be told.
          content_type() {
            case ${1##*.} in
              apk) echo application/vnd.android.package-archive ;;
              *)   echo application/octet-stream ;;
            esac
          }
          for file in dist/BaoCode-*; do
            aws s3 cp "$file" "s3://$R2_BUCKET/releases/mobile/$MARKETING/$(basename "$file")" \
              --cache-control 'public, max-age=31536000, immutable' \
              --content-type "$(content_type "$file")"
          done
      - name: Write the manifest, and check the downloads are served
        run: |
          # A 0.x version is a beta: the download page says so.
          beta=false
          [[ "$MARKETING" == 0.* ]] && beta=true
          entry() {
            local file=$1 sha size
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            size=$(stat -c %s "$file")
            jq -n --arg url "https://dl.baocode.dev/releases/mobile/$MARKETING/$(basename "$file")?sha256=${sha:0:16}" \
              --arg sha "$sha" --argjson size "$size" '{url: $url, size: $size, sha256: $sha}'
          }
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson beta "$beta" \
            --argjson android "$(entry dist/BaoCode-$MARKETING-android.apk)" \
            '{version: $version, pubDate: $date, beta: $beta, downloads: {android: $android}}' > latest.json
          cat latest.json
          jq -r '.downloads[] | "\(.url) \(.size)"' latest.json | while read -r url expected; do
            served=$(curl -fsSI "$url" | tr -d '\r' | awk 'tolower($1) == "content-length:" { print $2 }')
            echo "$url: $served bytes (expected $expected)"
            [ "$served" = "$expected" ] || { echo "::error::$url is not served as uploaded"; exit 1; }
          done
      - name: Upload latest.json, last
        run: |
          aws s3 cp latest.json "s3://$R2_BUCKET/releases/mobile/latest.json" \
            --cache-control 'public, max-age=300' --content-type application/json
          curl -fsS "https://dl.baocode.dev/releases/mobile/latest.json?$GITHUB_RUN_ID" | jq .
