name: SSH recent targeted tests

on:
  push:
    branches: [fix/ssh-recent-targeted-tests]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
          pub-cache: true
      - id: iroh
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.iroh.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - run: flutter pub get
      - name: Check changed Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/window/app_windows.dart lib/workbench.dart test/window/app_windows_test.dart
      - name: Analyze changed Dart files
        if: success() || failure()
        run: dart analyze --fatal-infos lib/window/app_windows.dart lib/workbench.dart test/window/app_windows_test.dart
      - name: Run window regression tests
        if: success() || failure()
        run: flutter test test/window/app_windows_test.dart
