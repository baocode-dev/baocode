# Keeps the code analyzable and its tests passing.
#
#   A pull request, a push to main   flutter analyze (infos too), and the
#                                    Dart files changed formatted
#   Each night, Actions → Checks →   the tests: the app's in shards, each
#   Run workflow                     package's on its own
#   A night's tests failing         an issue, on the run that failed, open
#                                   until the next night passes
#
# On Linux, the cheapest runner and the one least queued: the tests whose
# platform matters run under TargetPlatformVariant anyway. The whole suite
# is too slow for every pull request; a night's failure mails whoever last
# changed the schedule — and opens an issue, which stays: GitHub's mail is
# easy to lose, and one night's failure went unnoticed for days.
name: Checks

on:
  pull_request:
    paths-ignore: &docs
      - '**.md'
      - docs/**
      - release-notes/**
      - site/**
      - site-worker/**
  push:
    branches: [main]
    paths-ignore: *docs
  schedule:
    - cron: '47 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# A pull request's run gives way to its next push.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  analyze:
    name: Analyze
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      # The files changed alone: many older ones are not formatted yet.
      - name: Format the Dart files changed
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.dart')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Dart file changed"
            exit 0
          fi
          if ! dart format --output=none --set-exit-if-changed "${files[@]}"; then
            echo "::error::Not formatted: run dart format on the files above"
            exit 1
          fi

  test:
    name: Test ${{ matrix.dir }}${{ matrix.shard != '' && format(' ({0}/4)', matrix.shard) || '' }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: ., shard: '0' }
          - { dir: ., shard: '1' }
          - { dir: ., shard: '2' }
          - { dir: ., shard: '3' }
          - { dir: packages/bao_agent }
          - { dir: packages/bao_conpty }
          - { dir: packages/bao_editor }
          - { dir: packages/bao_iroh }
          - { dir: packages/bao_link }
          - { dir: packages/bao_markdown }
          - { dir: packages/bao_pty }
          - { dir: packages/bao_websearch }
          - { dir: packages/bao_xterm }
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      # The tests run bao_iroh's build hook: main's build of it, or Rust to
      # build it with.
      - id: iroh
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.iroh.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - run: flutter pub get
      - name: flutter test
        working-directory: ${{ matrix.dir }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$SHARD" ]; then
            flutter test --total-shards 4 --shard-index "$SHARD"
          else
            flutter test
          fi

  # A night's tests failing: an issue of its own, updated each night it
  # goes on failing and closed by the first that passes. Scheduled runs
  # mail whoever last changed the schedule; that mail is easy to lose —
  # one failure went unnoticed for days.
  nightly-failure:
    name: Nightly failure issue
    if: always() && github.event_name == 'schedule' && needs.test.result == 'failure'
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - env:
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          body="The nightly test run failed: $run_url

          This issue updates each failing night and closes when one passes."
          # One issue for the streak: an open one titled for this check.
          number=$(gh issue list --state open --search 'in:title "Nightly tests failing"' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $run_url"
          else
            gh issue create --title 'Nightly tests failing' --body "$body"
          fi

  nightly-passed:
    name: Close the nightly failure issue
    if: always() && github.event_name == 'schedule' && needs.test.result == 'success'
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search 'in:title "Nightly tests failing"' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "Green again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
