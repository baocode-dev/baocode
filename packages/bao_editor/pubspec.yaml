name: bao_editor
description: >-
  Monaco, ported to Flutter: the editor, its Monarch and TextMate
  highlighting (with Oniguruma, built by a native assets hook), VS Code's
  color themes and keybindings.
version: 0.1.0
# Not on pub.dev yet: see HANDOFF.md.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  code_assets: ^1.2.1
  flutter:
    sdk: flutter
  hooks: ^2.0.2
  native_toolchain_c: ^0.19.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/monaco/LICENSE.txt
    - assets/monaco/themes.json
    - assets/monaco/languages/
