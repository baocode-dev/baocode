[toolchain]
# An exact version, as native_toolchain_rust asks: the same build anywhere.
channel = "1.97.1"
targets = [
  # Android
  "armv7-linux-androideabi",
  "aarch64-linux-android",
  "x86_64-linux-android",
  # iOS (devices; the simulators)
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  # Windows
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  # Linux
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  # macOS
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
