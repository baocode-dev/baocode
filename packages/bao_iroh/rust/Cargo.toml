[package]
name = "bao_iroh"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "BaoCode's link transport: iroh endpoints, connections and framed streams behind a small C interface for Dart."

[lib]
# Said out loud: native_toolchain_rust reads the crate's name here, and a
# [lib] without one is a name only Rust itself makes up (this package's).
name = "bao_iroh"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# The version both apps and the relay (baocode-relay) speak: kept the same.
# No n0 defaults: no fast-apple-datapath (private Apple calls, kept out of
# the App Store build), no metrics.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
# Not used directly: held back for iOS. libc 0.2.190 made `in6_ifreq`
# macOS-only, and netdev (iroh -> netwatch) still uses it on iOS. Lift
# once netdev builds for aarch64-apple-ios with a newer libc.
libc = "=0.2.189"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = "debuginfo"
