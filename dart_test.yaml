tags:
  # Runs the real Claude Code CLI (and spends a few cents): opt in with
  # `flutter test --run-skipped -t e2e`.
  e2e:
    skip: "Runs the real Claude Code CLI"
  # Runs the local `dart language-server` (no network, no tokens): opt in
  # with `flutter test --run-skipped -t lsp-smoke`.
  lsp-smoke:
    skip: "Runs a real language server"
  # Runs a real VS Code server and extension host (needs the runtime under
  # BAOCODE_EXTHOST_DIR or downloaded): opt in with
  # `flutter test --run-skipped -t exthost`.
  exthost:
    skip: "Runs a real VS Code extension host"
  # Connects for real, with the system's ssh, to sshd containers
  # (tool/ssh_e2e.sh starts them and runs these): opt in with
  # `flutter test --run-skipped -t ssh-e2e`.
  ssh-e2e:
    skip: "Connects to sshd containers"
  # A project in a WSL distribution, on Windows with WSL: opt in with
  # `flutter test --run-skipped -t wsl-e2e` (see the test for its setup).
  wsl-e2e:
    skip: "Connects to a real WSL distribution"
